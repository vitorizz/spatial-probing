seed: 0

model:
  id: Qwen/Qwen2.5-VL-3B-Instruct
  dtype: float16
  attn_implementation: sdpa
  min_pixels: 200704      # 256 * 28 * 28
  max_pixels: 401408      # 512 * 28 * 28

prompts:
  fourway: "Where is the {o1} in relation to the {o2}? Answer with exactly one word: left, right, front, or behind."
  vsr: "Is the following statement true about the image? \"{caption}\" Answer yes or no."
  pope_suffix: " Answer yes or no."

options:
  fourway: [left, right, front, behind]
  yesno: [yes, no]

paths:
  drive_root: /content/drive/MyDrive/spatial_probe
