annotations_url: http://images.cocodataset.org/annotations/annotations_trainval2017.zip

pairs:
  min_area_frac: 0.02
  max_pairs_per_image: 3
  lateral_min_gap: 0.10
  lateral_max_overlap: 0.30   # fraction of the narrower box's width

images:
  max_side: 640
  jpeg_quality: 90
  workers: 16

depth:
  model: depth-anything/Depth-Anything-V2-Small-hf
  min_mask_pixels: 200
  min_gap: 0.15
  larger_is_closer: true   # to verify with check-depth, then record in NOTES.md

questions:
  negative_prob: 0.5
  val_fraction: 0.05       # of images
  max_train: 12000
  max_val: 600
  phrases:
    left: to the left of
    right: to the right of
    front: in front of
    behind: behind
  yesno_templates:
    - "Is the {o1} {phrase} the {o2}? Answer yes or no."
    - "Is it true that the {o1} is {phrase} the {o2}? Answer yes or no."
    - "Looking at the image, is the {o1} {phrase} the {o2}? Answer yes or no."
